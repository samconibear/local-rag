[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/rag", "src/fs.py", "src/tools.py", "src/main.py"]

[project]
name = "local-rag"
version = "0.1.0"
description = "mcp server for performing RAG locally"
requires-python = ">=3.10"
dependencies = [
    "mcp",
    "markitdown",
    "markitdown-pdf-pages @ git+https://github.com/samconibear/markitdown-pdf-pages.git",
    "langchain-text-splitters",
    "sentence-transformers",
    "faiss-cpu",
]